plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.hjih.trapbot'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.hjih.trapbot'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
